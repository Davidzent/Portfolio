packages:
  - "apps/*"
  - "packages/*"

# One version per dependency, workspace-wide. Apps reference these with
# `catalog:` instead of their own range, so bumping a shared tool is a one-line
# change here rather than four package.json edits that drift out of sync.
catalog:
  "@eslint/js": ^10.0.1
  "@types/node": ^24.13.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.4
  eslint: ^10.8.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.3
  globals: ^17.7.0
  gsap: ^3.15.0
  lenis: ^1.3.25
  motion: ^12.42.2
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ~6.0.2
  typescript-eslint: ^8.65.0
  vite: ^8.2.0
