name: Deploy to Firebase Hosting (live)

on:
  push:
    branches: [main]

permissions:
  contents: read

# One live deploy at a time, so two quick pushes can't finish out of order.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build all apps into dist/
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.WAREHOUSE_API_URL }}

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZNTSNS_34AEE }}
          channelId: live
          projectId: zntsns-34aee
